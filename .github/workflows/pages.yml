# Despliegue de la aplicación en GitHub Pages.
# La app es estática (HTML/CSS/JS sin compilación): se publica el repositorio tal cual.
# Se ejecuta en cada push a main y también a mano desde la pestaña Actions.
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un único despliegue a la vez; si llega otro push, se espera a que termine el actual.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar los ficheros del sitio
        # Solo lo que necesita la app en el navegador
        run: |
          mkdir _site
          cp -r index.html style.css js lib assets _site/

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
